[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cxp_protocol"
version = "0.1.0"
description = "Golden CoaXPress 1.1.1 (CXP-001-2015) protocol model: 8B/10B, CRC, packet and stream codecs, register map"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["cxp_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
